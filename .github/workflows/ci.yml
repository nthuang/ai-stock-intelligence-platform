name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stock_test
          POSTGRES_USER: stock_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_test -d stock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://stock_test:test_only_password@localhost:5432/stock_test
      PYTHON_DOTENV_DISABLED: "1"
      DATA_MODE: demo

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q backend scripts tests
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q
      - name: Reproduce committed backtest
        run: |
          python -m scripts.backtest_signals
          git diff --exit-code -- data/processed/backtest_metrics.json
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start offline demo
        env:
          API_PORT: "18000"
          POSTGRES_PORT: "15432"
        run: docker compose -p ci-demo up --build -d --wait api
      - name: Verify demo over HTTP
        run: python -m scripts.smoke_test --base-url http://localhost:18000
      - name: Stop demo containers
        if: always()
        run: docker compose -p ci-demo down
