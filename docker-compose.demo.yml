# Use a separate project/volume: docker compose -p portfolio-demo -f docker-compose.yml -f docker-compose.demo.yml up --build -d api
x-demo-env: &demo-env
  DATA_MODE: demo
  DEPLOYMENT_MODE: public_demo
  NEWS_ENABLED: "false"
  GROQ_API_KEY: ""
  TAVILY_API_KEY: ""
  NOTIFICATION_API_KEY: ""

services:
  api:
    environment: *demo-env
    ports: !override
      - "127.0.0.1:18002:8000"
  ingest:
    environment: *demo-env
  postgres:
    ports: !reset []
